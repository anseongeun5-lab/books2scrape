# pyproject.toml - 프로젝트 메타데이터 및 도구 설정 명세서

# 프로젝트 기본 메타데이터
[project]
name = "books2scrape"
version = "0.1.0"
description = "Books to Scrape 웹 스크래핑 프로젝트"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "playwright>=1.64.1",
    "plotly>=7.1.0",
    "pydantic>=2.14.3",
    "requests>=2.34.2",
    "selenium>=4.52.0",
    "streamlit>=1.67.0",
]

# CLI 실행 진입점 등록 (uv run books2scrape 형태로 실행 가능)
[project.scripts]
books2scrape = "books2scrape:main"

# uv 기본 빌드 백엔드 선언
[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

# 개발 의존성 패키지 그룹 분리
[dependency-groups]
dev = [
    "pytest>=9.2.0",  # 단위 테스트 프레임워크
    "ruff>=0.17.4",   # 초고속 린터 및 코드 포매터
]

# Ruff 코드 스타일 및 포매터 설정
[tool.ruff]
line-length = 88      # 표준 권장 라인 길이 (PEP 8 준수)
indent-width = 4      # 들여쓰기 공백 크기 (4칸)

# Ruff 린터 규칙 설정
[tool.ruff.lint]
select = ["E", "F", "I"]  # E(Pycodestyle 에러), F(Pyflakes 오류), I(isort import 정렬)
ignore = ["E501"]          # 초과 길이(E501)는 포매터와 긴 목업/주석 유연성을 위해 예외 처리
